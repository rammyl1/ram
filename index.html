<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pixel World Starter</title>
  <meta name="description" content="A minimal interactive pixel world demo for your portfolio. Arrow keys or WASD to move." />
  <style>
    :root{
      --scale: 10;
      --tile-size: 16;
      --tiles-x: 16;
      --tiles-y: 12;
    }
    html,body{height:100%;margin:0;background:#0b0b0f;color:#e6eef8;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial;}
    .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:18px;}
    header{display:flex;flex-direction:column;align-items:center;gap:6px}
    h1{margin:0;font-size:20px;letter-spacing:0.2px}
    .screen{
      width: calc(var(--tile-size) * var(--tiles-x) * var(--scale));
      height: calc(var(--tile-size) * var(--tiles-y) * var(--scale));
      background:#000;
      border-radius:8px;
      box-shadow:0 12px 40px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,0.02);
      overflow:hidden;
    }
    canvas{width:100%;height:100%;display:block;image-rendering:pixelated;background:transparent}
    .meta{max-width:760px;text-align:center;font-size:13px;opacity:.95}
    .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
    .kbd{background:#0f1720;border:1px solid #1b2430;padding:6px 9px;border-radius:6px;color:#9fe;font-weight:700;font-size:13px}
    footer{font-size:12px;opacity:.75}
    @media (max-width:640px){
      :root{--scale:3}
      .meta{font-size:13px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Pixel World Starter</h1>
      <div class="meta">A compact, portfolio-ready pixel world. Use Arrow keys or WASD to move. Space to dash.</div>
    </header>

    <div class="screen" id="screen">
      <canvas id="game" width="256" height="192" aria-label="Pixel world canvas"></canvas>
    </div>

    <div class="controls" aria-hidden="false">
      <div class="kbd">Arrow keys</div>
      <div class="kbd">W A S D</div>
      <div class="kbd">Space</div>
    </div>

    <footer>Tip change <strong>--scale</strong> in the CSS to resize the canvas for screenshots.</footer>
  </div>

  <script>
  // Pixel World Starter
  // Logical canvas: TILE * TILES_X by TILE * TILES_Y
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const TILE = 16;
  const TILES_X = 16;
  const TILES_Y = 12;
  const WIDTH = TILE * TILES_X;
  const HEIGHT = TILE * TILES_Y;
  canvas.width = WIDTH;
  canvas.height = HEIGHT;
  ctx.imageSmoothingEnabled = false;

  // Palette
  const palette = {
    sky: '#7ec0ff',
    cloud: '#eaf6ff',
    grass: '#3cb043',
    dirt: '#8b5a2b',
    water: '#2b6fb3',
    sand: '#e6d6a7',
    player: '#ffdd55',
    eye: '#1b1b1b',
    shadow: 'rgba(0,0,0,0.25)'
  };

  // Height map generation
  const cols = TILES_X;
  const rows = TILES_Y;
  const heightMap = new Array(cols);
  for (let x = 0; x < cols; x++) {
    const nx = x / cols;
    const h = Math.floor(
      (Math.sin(nx * Math.PI * 1.1) * 0.5 + 0.5) * (rows - 4)
      + (Math.sin(nx * Math.PI * 3.3) * 0.5 + 0.5) * 1.2
    );
    heightMap[x] = Math.max(1, Math.min(rows - 1, Math.floor(h)));
  }

  // Player
  const player = {
    px: 0, py: 0,
    speed: 3.5,
    size: 12,
    dashCooldown: 0
  };

  // Start player centered on middle column surface
  const startCol = Math.floor(cols / 2);
  player.px = startCol * TILE;
  player.py = (heightMap[startCol] - 1) * TILE;

  // Input
  const keys = {};
  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function update() {
    let vx = 0, vy = 0;
    if (keys['arrowleft'] || keys['a']) vx = -1;
    if (keys['arrowright'] || keys['d']) vx = 1;
    if (keys['arrowup'] || keys['w']) vy = -1;
    if (keys['arrowdown'] || keys['s']) vy = 1;

    const dash = keys[' '] || keys['space'];
    let sp = player.speed;
    if (dash && player.dashCooldown <= 0 && (vx !== 0 || vy !== 0)) {
      sp *= 2.2;
      player.dashCooldown = 20;
    }
    if (player.dashCooldown > 0) player.dashCooldown--;

    player.px += vx * sp;
    player.py += vy * sp;

    // Clamp to world
    player.px = Math.max(0, Math.min(WIDTH - TILE, player.px));
    player.py = Math.max(0, Math.min(HEIGHT - TILE, player.py));
  }

  function draw() {
    // Sky
    ctx.fillStyle = palette.sky;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Clouds
    for (let i = 0; i < 5; i++) {
      const cx = (i * 53) % WIDTH;
      const cy = 8 + (i % 3) * 6;
      ctx.fillStyle = palette.cloud;
      roundRect(ctx, cx, cy, 44, 12, 6, true);
    }

    // Tiles
    for (let x = 0; x < cols; x++) {
      const h = heightMap[x];
      for (let y = 0; y < rows; y++) {
        const px = x * TILE;
        const py = y * TILE;
        if (y < h - 1) continue;
        if (y === h - 1) {
          ctx.fillStyle = (h > rows - 4) ? palette.sand : palette.grass;
          ctx.fillRect(px, py, TILE, TILE);
        } else {
          ctx.fillStyle = palette.dirt;
          ctx.fillRect(px, py, TILE, TILE);
        }
      }
      if (heightMap[x] > rows - 3) {
        const wy = (rows - 2) * TILE;
        ctx.fillStyle = palette.water;
        ctx.fillRect(x * TILE, wy, TILE, TILE * 2);
      }
    }

    // Subtle grid
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= cols; x++) {
      ctx.beginPath();
      ctx.moveTo(x * TILE + 0.5, 0);
      ctx.lineTo(x * TILE + 0.5, HEIGHT);
      ctx.stroke();
    }
    for (let y = 0; y <= rows; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * TILE + 0.5);
      ctx.lineTo(WIDTH, y * TILE + 0.5);
      ctx.stroke();
    }

    // Player shadow
    const centerX = Math.floor(player.px + TILE / 2);
    const centerY = Math.floor(player.py + TILE / 2);
    ctx.fillStyle = palette.shadow;
    ctx.fillRect(centerX - player.size / 2 + 1, centerY + player.size / 2 - 2, player.size - 2, 4);

    // Player body
    ctx.fillStyle = palette.player;
    ctx.fillRect(centerX - player.size / 2, centerY - player.size / 2, player.size, player.size);

    // Eyes
    ctx.fillStyle = palette.eye;
    ctx.fillRect(centerX - 3, centerY - 2, 2, 2);
    ctx.fillRect(centerX + 1, centerY - 2, 2, 2);
  }

  function roundRect(ctx, x, y, w, h, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) ctx.fill();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
  </script>
</body>
</html>
