fr(34,23,9,6,3);fr(20,14,16,12,3);fr(40,14,14,12,3); // plazas
fr(20,40,16,12,3);fr(40,40,14,12,3);

  {id:'school', tx:20,ty:2,tw:16,th:12, data:{title:'B.S. Information Technology',co:'Cavite State University',pe:'2015 – 2019  |  GPA: 1.91',desc:'Earned a Bachelor of Science in IT building strong foundations in programming, networking, and systems analysis. The technical mindset forged here drives every role since — from hardware troubleshooting all the way to LLM evaluation.',tags:['IT Fundamentals','Programming','Networking','Systems Analysis','Software Development','GPA 1.91']}},
  {id:'ttec1',  tx:2, ty:2, tw:14,th:11,data:{title:'Technical / Support Specialist',co:'TTEC',pe:'08/2019 – 09/2022  (3 years 1 month)',desc:'Resolved 30–70+ daily technical cases covering hardware, software, and connectivity for Australian clients. Guided customers through system installations and advanced feature troubleshooting with consistently high CSAT ratings. Built deep product knowledge and maintained quality benchmarks that minimised escalations.',tags:['IT Troubleshooting','CSAT Excellence','Multi-Channel Support','Ticketing Systems','Hardware/Software QA','Knowledge Base Management','Escalation Handling']}},

// ── PIXEL HELPERS ────────────────────────────────────────────────────────────
function drawGrass(sx,sy,type){
  X.fillStyle=(sx+sy)%96<48?'#3a6b3a':'#2d5c2d'; X.fillRect(sx,sy,T,T);
  X.fillStyle='rgba(0,0,0,.06)'; if(type===4)X.fillRect(sx,sy,T,T);
  if(type===5){const fc=['#ff4488','#ffdd00','#ff8800','#ff66aa'];X.fillStyle=fc[(sx+sy)%4];X.fillRect(sx+18,sy+18,8,8);X.fillStyle='#228b22';X.fillRect(sx+20,sy+26,3,10);}
}
function drawCobble(sx,sy){
  X.fillStyle='#9a8c7a';X.fillRect(sx,sy,T,T);
  const off=(Math.floor(sy/T)%2)*Math.floor(T/2);
  X.fillStyle='#7a6c5a';
  for(let i=0;i<3;i++){const bx=sx+i*Math.floor(T*2/3)-off;X.fillRect(bx+1,sy+1,Math.floor(T*2/3)-2,Math.floor(T/2)-2);X.fillRect(bx+1,sy+T/2+1,Math.floor(T*2/3)-2,Math.floor(T/2)-2);}
  X.fillStyle='rgba(0,0,0,.1)';X.fillRect(sx,sy,T,1);X.fillRect(sx,sy,1,T);
}
function drawWater(sx,sy,t){
  const w=Math.floor(t/380)%3;
  X.fillStyle=w===0?'#1a55a8':w===1?'#1660bb':'#1248a0';X.fillRect(sx,sy,T,T);
  X.fillStyle='rgba(255,255,255,.12)';
  const wo=(Math.floor(t/340)+Math.floor(sx/T))%6;
  X.fillRect(sx+wo*8%T,sy+14,22,2);X.fillRect(sx+(wo*8+24)%T,sy+30,15,2);
}
function drawSand(sx,sy){X.fillStyle='#d4b878';X.fillRect(sx,sy,T,T);X.fillStyle='rgba(0,0,0,.05)';if((Math.floor(sx/T)+Math.floor(sy/T))%3===0)X.fillRect(sx+8,sy+8,5,5);}

// ── BUILDING RENDERERS ────────────────────────────────────────────────────────

function drawSchool(sx,sy,bw,bh,t){
  X.fillStyle='rgba(0,0,0,.3)';X.fillRect(sx+8,sy+8,bw,bh);
  // Brick body
  X.fillStyle='#8b4513';X.fillRect(sx,sy,bw,bh);
  for(let row=0;row<Math.ceil(bh/10);row++){
    const xo=(row%2)*16;X.fillStyle=row%3===0?'#7a3a0a':'#6b2f08';
    for(let col=0;col<Math.ceil(bw/32)+1;col++)X.fillRect(sx+col*32-xo+1,sy+row*10+1,30,8);
  }
  // White columns
  X.fillStyle='#e8dcc8';
  [0.18,0.38,0.62,0.82].forEach(r=>{const cx=sx+bw*r;X.fillRect(cx-5,sy+bh*.48,10,bh*.52);X.fillRect(cx-8,sy+bh*.46,16,8);X.fillRect(cx-8,sy+bh-10,16,10);});
  // Pediment
  X.fillStyle='#c8bfaa';X.beginPath();X.moveTo(sx-8,sy+bh*.45);X.lineTo(sx+bw/2,sy+bh*.26);X.lineTo(sx+bw+8,sy+bh*.45);X.closePath();X.fill();
  X.fillStyle='#a89f8c';X.fillRect(sx-4,sy+bh*.43,bw+8,6);
  // Clock tower
  const tw=62,th=bh*.58,tx=sx+bw/2-tw/2;
  X.fillStyle='#5a3010';X.fillRect(tx,sy-th,tw,th);
  for(let r=0;r<Math.ceil(th/10);r++){X.fillStyle='#4a2808';const xo=(r%2)*12;for(let c=0;c<4;c++)X.fillRect(tx+c*16-xo+1,sy-th+r*10+1,14,8);}
  X.fillStyle='#3a2408';X.beginPath();X.moveTo(tx-8,sy-th);X.lineTo(sx+bw/2,sy-th-44);X.lineTo(tx+tw+8,sy-th);X.closePath();X.fill();
  X.fillStyle='#777';X.fillRect(sx+bw/2-2,sy-th-64,4,26);
  X.fillStyle='#f4c430';X.fillRect(sx+bw/2-2,sy-th-66,4,4);
  // Clock
  X.fillStyle='#fff8e0';X.beginPath();X.arc(sx+bw/2,sy-th+24,15,0,Math.PI*2);X.fill();
  X.strokeStyle='#666';X.lineWidth=1.5;X.beginPath();X.arc(sx+bw/2,sy-th+24,15,0,Math.PI*2);X.stroke();
  const ang=t/5000;
  X.strokeStyle='#333';X.lineWidth=2;X.beginPath();X.moveTo(sx+bw/2,sy-th+24);X.lineTo(sx+bw/2+Math.cos(ang)*11,sy-th+24+Math.sin(ang)*11);X.stroke();
  X.lineWidth=1.5;X.beginPath();X.moveTo(sx+bw/2,sy-th+24);X.lineTo(sx+bw/2+Math.cos(ang*12)*8,sy-th+24+Math.sin(ang*12)*8);X.stroke();
  // Windows
  for(let r=0;r<2;r++)for(let c=0;c<5;c++){
    const wx=sx+20+c*(bw-40)/4,wy=sy+bh*.5+r*52;
    const lit=(Math.floor(t/2400)+c+r)%8!==0;
    X.fillStyle='#2a2a1a';X.fillRect(wx-9,wy-12,18,22);
    X.fillStyle=lit?'#fffac8':'#334433';X.fillRect(wx-7,wy-10,14,18);
    X.fillStyle='rgba(255,255,180,.3)';X.fillRect(wx-7,wy-10,5,18);
    X.fillStyle='rgba(0,0,0,.3)';X.fillRect(wx-1,wy-10,2,18);X.fillRect(wx-7,wy-2,14,2);
  }
  // Door & steps
  X.fillStyle='#2a1a08';X.fillRect(sx+bw/2-18,sy+bh-38,36,38);
  X.fillStyle='#8b6040';X.fillRect(sx+bw/2-14,sy+bh-35,28,32);
  X.fillStyle='rgba(255,255,255,.15)';X.fillRect(sx+bw/2-14,sy+bh-35,11,32);
  X.fillStyle='#f4c430';X.fillRect(sx+bw/2+9,sy+bh-22,4,7);
  X.fillStyle='#c8bfaa';X.fillRect(sx+bw/2-28,sy+bh-8,56,8);X.fillRect(sx+bw/2-22,sy+bh-14,44,6);
  // Sign
  X.fillStyle='rgba(0,0,0,.82)';X.fillRect(sx+bw/2-72,sy+bh-60,144,22);
  X.fillStyle='#f4c430';X.font='bold 8px "Courier New"';X.textAlign='center';X.fillText('CAVITE STATE UNIVERSITY',sx+bw/2,sy+bh-46);
  X.fillStyle='#e8c830';X.font='6px "Courier New"';X.fillText('🎓  B.S. INFORMATION TECHNOLOGY  2015-2019',sx+bw/2,sy+bh-33);
}

function drawOffice(sx,sy,bw,bh,t,wall,dark,trim,name,sub){
  X.fillStyle='rgba(0,0,0,.32)';X.fillRect(sx+8,sy+8,bw,bh);
  X.fillStyle=wall;X.fillRect(sx,sy,bw,bh);
  X.fillStyle=dark;X.fillRect(sx+6,sy,bw-12,bh);
  // Glass curtain
  for(let i=0;i<6;i++){X.fillStyle=`rgba(80,160,255,${0.03+i*.008})`;X.fillRect(sx+6+i*(bw-12)/6,sy,8,bh);}
  // Window grid
  const cols=Math.max(2,Math.floor((bw-20)/22)),rows=Math.max(2,Math.floor((bh-30)/26));
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const wx=sx+12+c*22,wy=sy+18+r*26;
    const lit=(Math.floor(t/2000)+c*3+r*5)%9!==0;
    X.fillStyle='#0a1822';X.fillRect(wx,wy,16,18);
    X.fillStyle=lit?'#aaddf0':'#0d1f2a';X.fillRect(wx+1,wy+1,14,16);
    if(lit){X.fillStyle='rgba(255,255,255,.18)';X.fillRect(wx+1,wy+1,5,16);}
  }
  // Lobby
  X.fillStyle=trim;X.fillRect(sx,sy+bh-22,bw,22);
  X.fillStyle=dark;X.fillRect(sx+4,sy+bh-20,bw-8,18);
  X.fillStyle='rgba(80,200,255,.25)';X.fillRect(sx+8,sy+bh-19,bw-16,16);
  X.fillStyle=trim;X.fillRect(sx+bw/2-16,sy+bh-18,13,16);X.fillRect(sx+bw/2+3,sy+bh-18,13,16);
  // Side fins
  X.fillStyle=trim;X.fillRect(sx-6,sy,6,bh);X.fillRect(sx+bw,sy,6,bh);
  for(let i=0;i<4;i++){X.fillStyle='rgba(0,0,0,.2)';X.fillRect(sx-6,sy+i*bh/4,6,2);}
  // Roof
  X.fillStyle=trim;X.fillRect(sx-4,sy-6,bw+8,8);
  // Antenna
  X.fillStyle='#888';X.fillRect(sx+bw/2-2,sy-34,4,30);
  X.fillStyle=Math.floor(t/500)%2===0?'#ff4444':'#880000';X.beginPath();X.arc(sx+bw/2,sy-36,4,0,Math.PI*2);X.fill();
  // Sign
  X.fillStyle='rgba(0,0,0,.88)';X.fillRect(sx+bw/2-60,sy+bh-56,120,22);
  X.fillStyle=trim;X.font='bold 8px "Courier New"';X.textAlign='center';X.fillText(name,sx+bw/2,sy+bh-41);
  X.fillStyle='#aac';X.font='6px "Courier New"';X.fillText(sub,sx+bw/2,sy+bh-29);
}

function drawGarage(sx,sy,bw,bh,t){
  X.fillStyle='rgba(0,0,0,.32)';X.fillRect(sx+8,sy+8,bw,bh);
  X.fillStyle='#1e2e1e';X.fillRect(sx,sy,bw,bh);
  for(let i=0;i<Math.ceil(bw/20);i++){X.fillStyle=i%2===0?'#1a2a1a':'#162416';X.fillRect(sx+i*20,sy,19,bh);}
  X.fillStyle='#00aa44';X.fillRect(sx,sy,bw,10);X.fillStyle='#00cc55';X.fillRect(sx,sy,bw,4);
  // Large garage door
  const gdw=bw-24,gdh=Math.floor(bh*.44);
  X.fillStyle='#141e14';X.fillRect(sx+12,sy+bh-gdh-4,gdw,gdh);
  for(let i=0;i<7;i++){X.fillStyle=i%2===0?'#1e2e1e':'#18261a';X.fillRect(sx+12,sy+bh-gdh-4+i*Math.floor(gdh/7),gdw,Math.floor(gdh/7)-1);}
  X.fillStyle='#444';X.fillRect(sx+12,sy+bh-gdh+Math.floor(gdh/2)-2,gdw,4);
  // Showroom windows
  for(let i=0;i<3;i++){
    const wx=sx+8+i*(bw-16)/3,ww2=Math.floor((bw-16)/3)-4;
    X.fillStyle='#0a1810';X.fillRect(wx,sy+18,ww2,42);
    X.fillStyle='rgba(0,220,100,.18)';X.fillRect(wx+1,sy+19,ww2-2,40);
    X.fillStyle='rgba(255,255,255,.08)';X.fillRect(wx+1,sy+19,8,40);
  }
  // Car in showroom
  const bob=Math.sin(t/1100)*1,cx=sx+bw/2-38;
  X.fillStyle='#22cc66';X.fillRect(cx+8,sy+26+bob,60,18);X.fillRect(cx+16,sy+18+bob,44,12);
  X.fillStyle='rgba(150,240,200,.5)';X.fillRect(cx+18,sy+19+bob,14,10);X.fillRect(cx+34,sy+19+bob,14,10);
  X.fillStyle='#111';X.fillRect(cx+5,sy+42+bob,18,12);X.fillRect(cx+53,sy+42+bob,18,12);
  X.fillStyle='#555';X.beginPath();X.arc(cx+14,sy+48+bob,6,0,Math.PI*2);X.fill();X.beginPath();X.arc(cx+62,sy+48+bob,6,0,Math.PI*2);X.fill();
  // Roof
  X.fillStyle='#003311';X.fillRect(sx-4,sy-6,bw+8,10);
  // Sign
  X.fillStyle='rgba(0,0,0,.9)';X.fillRect(sx+bw/2-54,sy+4,108,16);
  X.fillStyle='#00ee66';X.font='bold 8px "Courier New"';X.textAlign='center';X.fillText('WEBXLOO LLC',sx+bw/2,sy+16);
  X.fillStyle='#66bb88';X.font='5px "Courier New"';X.fillText('🚗  AUTOMOTIVE TECH  |  QA & DMS',sx+bw/2,sy+26);
}

function drawAILab(sx,sy,bw,bh,t){
  X.fillStyle='rgba(0,0,0,.32)';X.fillRect(sx+8,sy+8,bw,bh);
  X.fillStyle='#060616';X.fillRect(sx,sy,bw,bh);

    const lx=Math.cos(a-Math.PI/2)*lens[i]+sw,ly=Math.sin(a-Math.PI/2)*lens[i];
    X.strokeStyle=i%2===0?'#2d8b22':'#3daa2d';X.lineWidth=6-i*.4;X.lineCap='round';
    X.beginPath();X.moveTo(sx+sw,sy-56);X.lineTo(sx+lx+sw,sy-56+ly);X.stroke();
  });
  X.fillStyle='#8b6914';X.beginPath();X.arc(sx+sw,sy-58,4,0,Math.PI*2);X.fill();
}

function drawFlagPole(sx,sy,t){
  X.fillStyle='#aaa';X.fillRect(sx-2,sy-100,4,100);X.fillStyle='#888';X.fillRect(sx-5,sy-2,10,4);
  const w1=Math.sin(t/500)*4,w2=Math.sin(t/500+1)*4;
  X.fillStyle='#0038a8';X.beginPath();X.moveTo(sx+2,sy-100);X.lineTo(sx+2+32,sy-100+w1);X.lineTo(sx+2+64,sy-100+w2);X.lineTo(sx+2+64,sy-100+18);X.lineTo(sx+2+32,sy-100+18+w1*.5);X.lineTo(sx+2,sy-100+18);X.closePath();X.fill();
  X.fillStyle='#ce1127';X.beginPath();X.moveTo(sx+2,sy-100+18);X.lineTo(sx+2+32,sy-100+18+w1*.5);X.lineTo(sx+2+64,sy-100+18+w2);X.lineTo(sx+2+64,sy-100+36);X.lineTo(sx+2+32,sy-100+36+w1);X.lineTo(sx+2,sy-100+36);X.closePath();X.fill();
  X.fillStyle='#fff';X.beginPath();X.moveTo(sx+2,sy-100);X.lineTo(sx+2,sy-100+36);X.lineTo(sx+2+28,sy-100+18+w1*.3);X.closePath();X.fill();
  X.fillStyle='#f4c430';X.beginPath();X.arc(sx+10,sy-100+18+w1*.2,6,0,Math.PI*2);X.fill();
  for(let i=0;i<3;i++){const a=i/3*Math.PI*2-Math.PI/2;X.beginPath();X.arc(sx+10+Math.cos(a)*14,sy-100+18+w1*.2+Math.sin(a)*14,2.5,0,Math.PI*2);X.fill();}
}

function drawSariSari(sx,sy){
  X.fillStyle='#f0e0c0';X.fillRect(sx,sy-54,84,54);
  for(let i=0;i<9;i++){X.fillStyle=i%2===0?'#e8d4b0':'#dcc89e';X.fillRect(sx+i*9,sy-54,8,53);}
  X.fillStyle='#dd2211';X.fillRect(sx-5,sy-60,94,10);X.fillStyle='#ee3322';for(let i=0;i<9;i++)X.fillRect(sx-5+i*10,sy-54,9,8);
  X.fillStyle='#cc3311';X.beginPath();X.moveTo(sx-8,sy-60);X.lineTo(sx+42,sy-82);X.lineTo(sx+92,sy-60);X.closePath();X.fill();
  X.fillStyle='#fffaf0';X.fillRect(sx+5,sy-48,74,30);
  const cs=['#ff4444','#44ff44','#4444ff','#ffff44','#ff44ff','#44ffff'];
  cs.forEach((c,i)=>{X.fillStyle=c;X.fillRect(sx+8+i*12,sy-46,10,26);});
  X.fillStyle='#aa8844';X.fillRect(sx,sy-18,84,18);X.fillStyle='#886633';X.fillRect(sx,sy-18,84,4);
  X.fillStyle='rgba(0,0,0,.8)';X.fillRect(sx+4,sy-52,76,12);
  X.fillStyle='#f4c430';X.font='5px "Courier New"';X.textAlign='center';X.fillText('TINDAHAN NI ATE',sx+42,sy-44);
}

function drawBahayKubo(sx,sy){
  for(let i=0;i<3;i++){X.fillStyle='#8b6914';X.fillRect(sx+12+i*24,sy+22,6,24);}
  X.fillStyle='#a07830';X.fillRect(sx,sy+22,84,8);
  X.fillStyle='#c8a020';X.fillRect(sx,sy-20,84,44);
  for(let i=0;i<8;i++){X.fillStyle=i%2===0?'#b89018':'#a07010';X.fillRect(sx+i*10,sy-20,9,43);}
  X.fillStyle='#8b7330';X.beginPath();X.moveTo(sx-8,sy-20);X.lineTo(sx+42,sy-64);X.lineTo(sx+92,sy-20);X.closePath();X.fill();
  X.fillStyle='#7a6228';X.beginPath();X.moveTo(sx-4,sy-20);X.lineTo(sx+42,sy-58);X.lineTo(sx+88,sy-20);X.closePath();X.fill();
  X.strokeStyle='rgba(0,0,0,.2)';X.lineWidth=1;for(let i=0;i<15;i++){X.beginPath();X.moveTo(sx-8+i*7,sy-20);X.lineTo(sx+42,sy-64);X.stroke();}
  X.fillStyle='#5a4010';X.fillRect(sx+14,sy-10,18,16);X.fillStyle='rgba(100,200,255,.3)';X.fillRect(sx+16,sy-8,14,12);
  X.fillStyle='#6a3a10';X.fillRect(sx+32,sy-10,20,32);
  X.fillStyle='rgba(0,0,0,.8)';X.fillRect(sx+4,sy-4,76,11);X.fillStyle='#f4c430';X.font='5px "Courier New"';X.textAlign='center';X.fillText('BAHAY KUBO',sx+42,sy+4);
}

// Big jeepney
let jeepX=-200;
function drawJeepney(sx,sy,t){
  const bob=Math.sin(t/400)*1.5,bw=168,bh=80;
  X.fillStyle='rgba(0,0,0,.3)';X.fillRect(sx+6,sy+bob+8,bw,bh);
  X.fillStyle='#dd2211';X.fillRect(sx,sy+bob,bw,bh);
  X.fillStyle='#cc9900';X.fillRect(sx+4,sy-28+bob,bw-8,32);
  X.fillStyle='#ddd';X.fillRect(sx,sy+bob,bw,4);X.fillRect(sx,sy+bh-4+bob,bw,4);
  X.fillStyle='#ccc';X.fillRect(sx,sy+bob,4,bh);X.fillRect(sx+bw-4,sy+bob,4,bh);
  // Top windows
  X.fillStyle='#001133';for(let i=0;i<5;i++){X.fillRect(sx+8+i*28,sy-24+bob,23,19);X.fillStyle='rgba(100,200,255,.45)';X.fillRect(sx+9+i*28,sy-23+bob,10,17);X.fillStyle='rgba(255,255,255,.18)';X.fillRect(sx+9+i*28,sy-23+bob,4,17);X.fillStyle='#001133';}
  X.fillStyle='#002255';X.fillRect(sx+bw-30,sy-22+bob,26,17);X.fillStyle='rgba(100,200,255,.45)';X.fillRect(sx+bw-28,sy-20+bob,22,13);
  // Decorative strips
  X.fillStyle='#ffcc00';X.fillRect(sx+8,sy+10+bob,bw-16,7);X.fillRect(sx+8,sy+bh-20+bob,bw-16,7);
  X.fillStyle='#ff6600';for(let i=0;i<10;i++)X.fillRect(sx+8+i*14,sy+10+bob,8,7);
  X.fillStyle='rgba(0,0,0,.32)';X.fillRect(sx+bw-42,sy+18+bob,38,42);
  X.fillStyle='#ffcc00';X.font='bold 7px "Courier New"';X.textAlign='center';X.fillText('RAMMYL',sx+bw-23,sy+34+bob);X.fillText('🇵🇭',sx+bw-23,sy+50+bob);
  // Big wheels
  [28,136].forEach(wx=>{
    const wr=(t/200)%(Math.PI*2);
    X.fillStyle='#1a1008';X.beginPath();X.arc(sx+wx,sy+bh+14+bob,22,0,Math.PI*2);X.fill();
    X.fillStyle='#333';X.beginPath();X.arc(sx+wx,sy+bh+14+bob,17,0,Math.PI*2);X.fill();
    X.fillStyle='#aaa';X.beginPath();X.arc(sx+wx,sy+bh+14+bob,9,0,Math.PI*2);X.fill();
    X.save();X.translate(sx+wx,sy+bh+14+bob);X.rotate(wr);
    X.fillStyle='#888';for(let s=0;s<5;s++){const a=s/5*Math.PI*2;X.fillRect(Math.cos(a)*6-2,Math.sin(a)*6-2,4,4);}
    X.restore();
    X.fillStyle='#111';X.fillRect(sx+wx-24,sy+bh-4+bob,4,22);X.fillRect(sx+wx+20,sy+bh-4+bob,4,22);
  });
  // Smoke
  X.save();
  for(let i=0;i<3;i++){const sm=(t+i*220)%900;if(sm<700){X.globalAlpha=(1-sm/700)*.45;X.fillStyle='#666';X.beginPath();X.arc(sx-8,sy+bh/2+bob-sm/22,3+sm/70,0,Math.PI*2);X.fill();}}
  X.globalAlpha=1;X.restore();
}

// ── WORLD DECORATIONS ────────────────────────────────────────────────────────
const PALMS=[[8,8],[13,8],[28,4],[50,4],[60,5],[66,8],[5,36],[14,38],[60,36],[67,38],[26,25],[51,25],[26,33],[51,33],[10,22],[70,22]];
const SARIS=[{x:62*T,y:32*T},{x:11*T,y:32*T}];
const BAHAYS=[{x:7*T,y:47*T},{x:60*T,y:47*T}];
const FLAGS=[{x:36*T,y:52*T},{x:4*T,y:52*T},{x:70*T,y:52*T}];

// ── INPUT & CAMERA ────────────────────────────────────────────────────────────
const K={};
document.addEventListener('keydown',e=>{K[e.code]=true;if(e.code==='Space'||e.code==='Enter')tryInteract();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();});
document.addEventListener('keyup',e=>{K[e.code]=false;});

let camX=PL.x-C.width/2,camY=PL.y-C.height/2;
let panelOpen=false;

function closePanel(){document.getElementById('panel').classList.remove('open');panelOpen=false;}
function openById(id){const b=BLDS.find(b=>b.id===id);if(b){document.getElementById('p-title').textContent=b.data.title;document.getElementById('p-co').textContent=b.data.co;document.getElementById('p-pe').textContent=b.data.pe;document.getElementById('p-desc').textContent=b.data.desc;document.getElementById('panel-tags').innerHTML=b.data.tags.map(t=>`<span>${t}</span>`).join('');document.getElementById('panel').classList.add('open');panelOpen=true;}}
function getNear(){const px=PL.x/T,py=PL.y/T;return BLDS.find(b=>px>b.tx-2&&px<b.tx+b.tw+2&&py>b.ty-2&&py<b.ty+b.th+2)||null;}
function tryInteract(){if(panelOpen){closePanel();return;}const nb=getNear();if(nb)openById(nb.id);}

function update(){
  if(panelOpen)return;
  let dx=0,dy=0;
  if(K['ArrowUp']||K['KeyW']){dy=-1;PL.face='up';}
  if(K['ArrowDown']||K['KeyS']){dy=1;PL.face='down';}
  if(K['ArrowLeft']||K['KeyA']){dx=-1;PL.face='left';}
  if(K['ArrowRight']||K['KeyD']){dx=1;PL.face='right';}
  if(dx&&dy){dx*=.707;dy*=.707;}
  PL.moving=dx!==0||dy!==0;
  if(PL.moving)PL.ft++;
  const spd=PL.spd*2;
  let nx=PL.x+dx*spd,ny=PL.y+dy*spd;
  let blocked=false;
  for(const b of BLDS){if(nx>b.tx*T-14&&nx<(b.tx+b.tw)*T+14&&ny>b.ty*T-24&&ny<(b.ty+b.th)*T+12){blocked=true;break;}}
  const tx=Math.floor(nx/T),ty=Math.floor(ny/T);
  if(ty>=0&&ty<WH&&tx>=0&&tx<WW&&MAP[ty][tx]===2)blocked=true;
  if(nx<T||nx>(WW-1)*T||ny<T||ny>(WH-1)*T)blocked=true;
  if(!blocked){PL.x=nx;PL.y=ny;}
  camX+=(PL.x-C.width/2-camX)*.1;
  camY+=(PL.y-C.height/2-camY)*.1;
  camX=Math.max(0,Math.min(camX,WW*T-C.width));
  camY=Math.max(0,Math.min(camY,WH*T-C.height));
  updateNPCs();
  jeepX+=2.4;if(jeepX>WW*T+220)jeepX=-220;
  document.getElementById('interact-hint').style.display=getNear()?'block':'none';
}

function drawMinimap(){
  MX.fillStyle='#080514';MX.fillRect(0,0,130,90);
  const sx=130/WW,sy=90/WH;
  for(let y=0;y<WH;y+=2)for(let x=0;x<WW;x+=2){MX.fillStyle=MAP[y][x]===2?'#1a55a8':MAP[y][x]===1?'#9a8c7a':MAP[y][x]===3?'#c8a030':'#3a6b3a';MX.fillRect(x*sx,y*sy,sx*2,sy*2);}
  BLDS.forEach(b=>{MX.fillStyle='#f4c430';MX.fillRect(b.tx*sx,b.ty*sy,b.tw*sx,b.th*sy);});
  MX.fillStyle='#fff';MX.fillRect(PL.x/T*sx-2,PL.y/T*sy-2,4,4);
  MX.strokeStyle='rgba(255,255,255,.25)';MX.lineWidth=1;MX.strokeRect(camX/T*sx,camY/T*sy,(C.width/T)*sx,(C.height/T)*sy);
}

function render(t){
  X.fillStyle='#050312';X.fillRect(0,0,C.width,C.height);
  const stx=Math.max(0,Math.floor(camX/T)),sty=Math.max(0,Math.floor(camY/T));
  const etx=Math.min(WW,stx+Math.ceil(C.width/T)+2),ety=Math.min(WH,sty+Math.ceil(C.height/T)+2);
  for(let ty=sty;ty<ety;ty++)for(let tx=stx;tx<etx;tx++){
    const sx=tx*T-camX,sy=ty*T-camY,v=MAP[ty][tx];
    if(v===1)drawCobble(sx,sy);else if(v===2)drawWater(sx,sy,t);else if(v===3)drawSand(sx,sy);else drawGrass(sx,sy,v);
  }
  // Background decorations
  FLAGS.forEach(f=>drawFlagPole(f.x-camX,f.y-camY,t));
  BAHAYS.forEach(b=>drawBahayKubo(b.x-camX,b.y-camY));
  SARIS.forEach(s=>drawSariSari(s.x-camX,s.y-camY));
  PALMS.filter(([px])=>px<38).forEach(([px,py])=>drawPalmTree(px*T-camX,py*T-camY,t));
  // Jeepney
  drawJeepney(jeepX-camX,27*T-camY,t);
  // Buildings (Y-sorted for depth)
  [...BLDS].sort((a,b)=>a.ty-b.ty).forEach(b=>{
    const inView=b.tx*T-camX<C.width+220&&(b.tx+b.tw)*T-camX>-220&&b.ty*T-camY<C.height+220&&(b.ty+b.th)*T-camY>-220;
    if(inView)drawBuilding(b,camX,camY,t,getNear()?.id===b.id);
  });
  PALMS.filter(([px])=>px>=38).forEach(([px,py])=>drawPalmTree(px*T-camX,py*T-camY,t));
  // Entities sorted by Y
  const entities=[...NPCS.map(n=>({y:n.py,draw:()=>drawNPC(n,camX,camY)})),{y:PL.y,draw:()=>drawPlayer(camX,camY)}];
  entities.sort((a,b)=>a.y-b.y).forEach(e=>e.draw());
  // Post-processing
  X.fillStyle='rgba(0,0,0,.03)';for(let y=0;y<C.height;y+=3)X.fillRect(0,y,C.width,1);
  const vig=X.createRadialGradient(C.width/2,C.height/2,C.height*.25,C.width/2,C.height/2,C.height*.88);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.52)');
  X.fillStyle=vig;X.fillRect(0,0,C.width,C.height);
  drawMinimap();
}

function loop(t){update();render(t);requestAnimationFrame(loop);}
window.addEventListener('resize',()=>{C.width=window.innerWidth;C.height=window.innerHeight;});
requestAnimationFrame(loop);
</script>
</body>
